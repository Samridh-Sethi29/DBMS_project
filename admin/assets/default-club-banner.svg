<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 420" width="100%" height="100%">
  <defs>
    <!-- Background Linear Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="25%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <radialGradient id="glow-cyan" cx="85%" cy="20%" r="65%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.38" />
      <stop offset="45%" stop-color="#3b82f6" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow-purple" cx="15%" cy="85%" r="55%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.32" />
      <stop offset="55%" stop-color="#6366f1" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Cyber Grid Pattern -->
    <pattern id="cyber-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#38bdf8" stroke-width="0.6" stroke-opacity="0.12" />
      <circle cx="40" cy="0" r="1.5" fill="#38bdf8" fill-opacity="0.25" />
    </pattern>

    <linearGradient id="accent-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0" />
      <stop offset="25%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#818cf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="badge-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>

  <!-- Base Canvas Layers -->
  <rect width="1400" height="420" fill="url(#bg-grad)" />
  <rect width="1400" height="420" fill="url(#glow-cyan)" />
  <rect width="1400" height="420" fill="url(#glow-purple)" />
  <rect width="1400" height="420" fill="url(#cyber-grid)" />

  <!-- Abstract Geometry & Tech Circuits -->
  <g opacity="0.32">
    <circle cx="1180" cy="180" r="160" fill="none" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="6 8" />
    <circle cx="1180" cy="180" r="220" fill="none" stroke="#818cf8" stroke-width="1" stroke-dasharray="14 14" />
    <circle cx="1180" cy="180" r="90" fill="none" stroke="#38bdf8" stroke-width="2" />
    
    <path d="M 880 120 L 1040 120 L 1100 180 L 1280 180" fill="none" stroke="#38bdf8" stroke-width="2" />
    <circle cx="1040" cy="120" r="4.5" fill="#06b6d4" />
    <circle cx="1100" cy="180" r="4.5" fill="#818cf8" />
    <circle cx="1280" cy="180" r="5" fill="#38bdf8" />

    <path d="M 960 260 L 1060 260 L 1120 200 L 1320 200" fill="none" stroke="#a855f7" stroke-width="1.8" />
    <circle cx="1060" cy="260" r="4" fill="#c084fc" />
    <circle cx="1320" cy="200" r="4.5" fill="#a855f7" />
  </g>

  <!-- Glowing Accent Bottom Bar -->
  <rect y="414" width="1400" height="6" fill="url(#accent-line)" />

  <!-- Decorative Code Glyphs & Tech Elements on Right -->
  <g transform="translate(1060, 110)" opacity="0.18">
    <text font-family="'Courier New', monospace" font-size="140" font-weight="900" fill="#38bdf8">&lt;/&gt;</text>
  </g>

  <!-- Constellation Dots & Sparks -->
  <g fill="#38bdf8" opacity="0.7">
    <circle cx="240" cy="70" r="2.5" />
    <circle cx="430" cy="55" r="1.8" />
    <circle cx="580" cy="100" r="2.8" opacity="0.9" fill="#06b6d4" />
    <circle cx="760" cy="65" r="2" />
    <circle cx="910" cy="90" r="3" opacity="0.95" fill="#38bdf8" />
    <circle cx="680" cy="140" r="1.5" />
    <circle cx="310" cy="130" r="2.2" />
    <circle cx="150" cy="240" r="2.5" />
    <circle cx="720" cy="230" r="2" />
  </g>

  <!-- Modern Tech Club Badge & Typography Overlay -->
  <g transform="translate(70, 75)">
    <!-- Category Pill -->
    <rect x="0" y="0" width="200" height="34" rx="17" fill="#0f172a" stroke="#38bdf8" stroke-width="1.4" fill-opacity="0.85" />
    <circle cx="18" cy="17" r="4.5" fill="#10b981" />
    <text x="32" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="0.1em">TECHNICAL SOCIETY</text>

    <!-- Main Club Name -->
    <text x="0" y="90" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="900" fill="#ffffff" letter-spacing="-0.03em">ACM Student Chapter</text>

    <!-- Tagline & Department -->
    <text x="0" y="132" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="500" fill="#94a3b8">Department of Computer Science &amp; Engineering · SVNIT Campus</text>

    <!-- Highlights Pill Badges -->
    <g transform="translate(0, 165)">
      <rect x="0" y="0" width="160" height="34" rx="8" fill="#1e293b" fill-opacity="0.75" stroke="#334155" stroke-width="1" />
      <text x="14" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#38bdf8">👥 120 Members</text>

      <rect x="175" y="0" width="175" height="34" rx="8" fill="#1e293b" fill-opacity="0.75" stroke="#334155" stroke-width="1" />
      <text x="189" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#a855f7">🚀 HackNova 2026</text>

      <rect x="365" y="0" width="185" height="34" rx="8" fill="#1e293b" fill-opacity="0.75" stroke="#334155" stroke-width="1" />
      <text x="379" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#10b981">⚡ Weekly Sprints</text>
    </g>
  </g>
</svg>